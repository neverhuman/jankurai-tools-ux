schema_version = "1.0.0"

enabled_tools = [
  "gitleaks",
  "npm",
  "zizmor",
  "syft",
  "grype",
  "trivy"
]

required_tools = [
  "gitleaks"
]

advisory_tools = [
  "npm",
  "zizmor",
  "syft"
]

[severity_thresholds]
fail_lane_on = "high"

[profiles.local]
enabled_tools = ["gitleaks", "npm", "zizmor", "syft"]
required_tools = ["gitleaks"]
advisory_tools = ["npm", "zizmor", "syft"]

[profiles.ci]
enabled_tools = ["gitleaks", "npm", "zizmor", "syft", "grype", "trivy"]
required_tools = ["gitleaks", "npm", "zizmor"]
advisory_tools = ["syft", "grype", "trivy"]

[profiles.release]
enabled_tools = ["gitleaks", "npm", "zizmor", "syft", "grype", "trivy"]
required_tools = ["gitleaks", "npm", "zizmor", "syft"]
advisory_tools = []
require_one_of = [["grype", "trivy"]]
