# Generated zones for jankurai-tools-ux.
# Every zone below points at a real generated output tree in this repo. These
# trees are never hand-edited; they are regenerated by their source command.

[[zone]]
path = "target/"
source = "jankurai audit lane"
command = "jankurai audit . --no-score-history --json .jankurai/repo-score.json --md .jankurai/repo-score.md"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = "contracts/generated/"
source = "contracts/ux-qa-report.openapi.json (UX QA report OpenAPI contract)"
command = "npm --workspace @jankurai/ux-qa run build"
read_only = true
write_policy = "generator_only"

[[zone]]
path = "package-lock.json"
source = "package.json and packages/*/package.json"
command = "npm install --package-lock-only"
read_only = true
write_policy = "lockfile"
